  </g>

  <!-- GRASS -->
  <rect x="0" y="430" width="1000" height="270" fill="url(#grassG)"/>

  <!-- HOUSES row -->
  <g>
    <g transform="translate(60,300)"><rect x="0" y="40" width="120" height="120" fill="#f3c85a"/><path d="M-8,40 L60,-6 L128,40 Z" fill="#9c4a34"/><rect x="18" y="70" width="30" height="30" fill="#bfe3f5"/><rect x="72" y="70" width="30" height="30" fill="#bfe3f5"/><rect x="45" y="112" width="30" height="48" fill="#7a4a2e"/></g>
    <g transform="translate(210,320)"><rect x="0" y="30" width="110" height="110" fill="#e88a6a"/><path d="M-8,30 L55,-8 L118,30 Z" fill="#6a3f2c"/><rect x="16" y="58" width="26" height="26" fill="#bfe3f5"/><rect x="66" y="58" width="26" height="26" fill="#bfe3f5"/><rect x="42" y="96" width="26" height="44" fill="#5a3722"/></g>
    <g transform="translate(720,312)"><rect x="0" y="34" width="115" height="116" fill="#8fb96a"/><path d="M-8,34 L57,-6 L122,34 Z" fill="#4f3a2a"/><rect x="16" y="62" width="28" height="28" fill="#bfe3f5"/><rect x="70" y="62" width="28" height="28" fill="#bfe3f5"/><rect x="44" y="102" width="28" height="48" fill="#5a3722"/></g>
    <g transform="translate(858,326)"><rect x="0" y="28" width="100" height="122" fill="#c9a2d8"/><path d="M-8,28 L50,-8 L108,28 Z" fill="#5a4064"/><rect x="14" y="54" width="24" height="24" fill="#bfe3f5"/><rect x="60" y="54" width="24" height="24" fill="#bfe3f5"/><rect x="38" y="92" width="24" height="58" fill="#4a3550"/></g>
