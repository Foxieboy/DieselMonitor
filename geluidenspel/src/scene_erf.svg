    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/><stop offset="0.7" stop-color="#a9dcf5"/><stop offset="1" stop-color="#d8f0fb"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7d47a"/><stop offset="1" stop-color="#8bc061"/></linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fc75f"/><stop offset="1" stop-color="#6fae49"/></linearGradient>
    <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ec95c"/><stop offset="1" stop-color="#6fb246"/></linearGradient>
    <linearGradient id="barnG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cf4436"/><stop offset="1" stop-color="#a5301f"/></linearGradient>
    <linearGradient id="roofG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#59392e"/><stop offset="1" stop-color="#3f281f"/></linearGradient>
    <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff6c8"/><stop offset="0.6" stop-color="#ffe27a"/><stop offset="1" stop-color="#ffd23f"/></radialGradient>
