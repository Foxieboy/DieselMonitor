    <linearGradient id="hWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbf3e2"/><stop offset="1" stop-color="#f2e6cf"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="700" fill="url(#hSky)"/>
  <circle cx="880" cy="90" r="44" fill="#ffe27a"/>
  <g fill="#ffffff" opacity="0.9"><ellipse cx="180" cy="92" rx="48" ry="20"/><ellipse cx="222" cy="82" rx="34" ry="17"/></g>
  <rect x="0" y="655" width="1000" height="45" fill="#8ec95c"/>

  <!-- huis -->
  <rect x="70" y="190" width="860" height="470" fill="url(#hWall)"/>
  <path d="M40,192 L500,58 L960,192 Z" fill="url(#hRoof)"/>
  <rect x="470" y="96" width="46" height="60" rx="5" fill="#8a5a34"/>
  <!-- kamerscheidingen -->
  <g fill="#c9a98a">
