      <g fill="#8a939b"><circle cx="-120" cy="40" r="6"/><circle cx="-70" cy="40" r="6"/><circle cx="10" cy="40" r="7"/><circle cx="70" cy="40" r="7"/><circle cx="112" cy="40" r="7"/></g>
