      <circle cx="-30" cy="-40" r="15" fill="#c9502f"/><circle cx="30" cy="-40" r="15" fill="#c9502f"/>
      <rect x="-7" y="-54" width="14" height="12" rx="4" fill="#8a3a22"/>
      <circle cx="0" cy="4" r="43" fill="#e4553a"/>
