<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Doorsnede van een huis met geluiden">
  <defs>
    <style>.hit{fill:transparent;}.animal-node{cursor:pointer;}</style>
    <linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad8f2"/><stop offset="1" stop-color="#d9f0fa"/></linearGradient>
