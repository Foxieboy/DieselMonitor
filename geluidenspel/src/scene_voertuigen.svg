      <circle cx="-40" cy="34" r="20" fill="#2a2f34"/><circle cx="-40" cy="34" r="9" fill="#c9a24a"/>
      <circle cx="34" cy="30" r="38" fill="#2a2f34"/><circle cx="34" cy="30" r="16" fill="#c9a24a"/>
      <circle cx="34" cy="30" r="6" fill="#2a2f34"/>
