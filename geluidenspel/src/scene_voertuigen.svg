      <path d="M78,-2 q30,2 30,2 q0,0 -30,2 z" fill="#cfd9e2"/>
      <path d="M-70,-6 L-104,-44 L-78,-6 Z" fill="#3fa9e0"/>
      <path d="M-96,-40 L-70,-6 L-104,-6 Z" fill="#2b86bd"/>
