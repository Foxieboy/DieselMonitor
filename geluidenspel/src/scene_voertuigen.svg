    <linearGradient id="trainG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e05a3a"/><stop offset="1" stop-color="#bf4529"/></linearGradient>
    <linearGradient id="planeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe4ec"/></linearGradient>
  </defs>

