    <linearGradient id="vskyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ec8f0"/><stop offset="0.7" stop-color="#a9dcf5"/><stop offset="1" stop-color="#dff2fb"/></linearGradient>
    <radialGradient id="vsunG" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff6c8"/><stop offset="0.6" stop-color="#ffe27a"/><stop offset="1" stop-color="#ffd23f"/></radialGradient>
    <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ec95c"/><stop offset="1" stop-color="#77bd4b"/></linearGradient>
    <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b7078"/><stop offset="1" stop-color="#565b62"/></linearGradient>
    <linearGradient id="fireG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5402e"/><stop offset="1" stop-color="#c02a1c"/></linearGradient>
    <linearGradient id="carG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fa9e0"/><stop offset="1" stop-color="#2b86bd"/></linearGradient>
