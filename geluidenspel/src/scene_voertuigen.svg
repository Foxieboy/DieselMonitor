      <circle cx="-50" cy="18" r="34" fill="none" stroke="#2a2f34" stroke-width="7"/>
      <circle cx="50" cy="18" r="34" fill="none" stroke="#2a2f34" stroke-width="7"/>
      <g stroke="#9aa1a8" stroke-width="2">
        <line x1="-50" y1="18" x2="-50" y2="-16"/><line x1="-50" y1="18" x2="-18" y2="30"/><line x1="-50" y1="18" x2="-80" y2="26"/><line x1="-50" y1="18" x2="-30" y2="-8"/>
        <line x1="50" y1="18" x2="50" y2="-16"/><line x1="50" y1="18" x2="18" y2="30"/><line x1="50" y1="18" x2="80" y2="26"/><line x1="50" y1="18" x2="30" y2="-8"/>
      </g>
