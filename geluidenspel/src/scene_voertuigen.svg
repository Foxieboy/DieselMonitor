      <line x1="0" y1="18" x2="50" y2="18" stroke="#e5402e" stroke-width="7"/>
      <line x1="28" y1="-30" x2="50" y2="18" stroke="#e5402e" stroke-width="7"/>
      <line x1="28" y1="-34" x2="46" y2="-42" stroke="#2a2f34" stroke-width="6" stroke-linecap="round"/>
      <path d="M-22,-30 l-12,-6" stroke="#2a2f34" stroke-width="7" stroke-linecap="round"/>
      <circle cx="0" cy="18" r="6" fill="#2a2f34"/>
