      <path d="M-78,20 q-6,-26 18,-30 q10,-24 34,-24 q30,0 44,24 q28,2 40,30 z" fill="url(#carG)"/>
      <path d="M-24,-30 q8,-16 26,-16 q22,0 32,16 l-6,14 l-52,0 z" fill="#cfeaf8"/>
